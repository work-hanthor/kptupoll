<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'">
<title>공공운수노조 간부 정치의식 조사</title>
<style>
  /* 외부 글꼴·CDN을 쓰지 않습니다(응답자 IP가 외부 업체로 넘어가지 않도록). */
  :root{
    --ink:#1d2430; --muted:#5b6474; --line:#d9dee6; --bg:#f4f6f9; --card:#fff;
    --brand:#14507a; --brand-ink:#fff; --brand-soft:#e6eff6; --warn:#b3261e; --warn-soft:#fdecea;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Noto Sans CJK KR",sans-serif;
    font-size:17px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}
  header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
  header.top .in{max-width:720px;margin:0 auto;padding:10px 16px}
  header.top .t{font-weight:700;font-size:15px}
  header.top .sec{font-size:13px;color:var(--muted)}
  .bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
  h1{font-size:24px;line-height:1.35;margin:28px 0 16px}
  h2{font-size:20px;margin:28px 0 12px;color:var(--brand)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px;margin:14px 0}
  .card.err{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-soft)}
  .intro p{margin:0 0 12px}
  .intro .meta{font-size:15px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:16px}
  .notice{background:var(--brand-soft);border-radius:10px;padding:12px 14px;font-size:15px;margin:14px 0}
  fieldset{border:0;margin:0;padding:0;min-width:0}
  .q{font-weight:700;font-size:17px;margin:0 0 6px;padding:0;display:block}
  .q .n{color:var(--brand);margin-right:4px}
  .hint{font-size:14px;color:var(--muted);margin:0 0 10px}
  .fn{font-size:14px;line-height:1.55;color:#3d4249;margin:2px 0 8px;padding-left:1em;text-indent:-1em}
  .fn+.fn{margin-top:-4px}
  .tag{display:inline-block;background:#c62828;color:#fff;font-weight:700;font-size:14px;line-height:1.4;padding:1px 8px;border-radius:5px;margin-left:4px;vertical-align:1px;white-space:nowrap}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;min-height:48px}
  .opt:hover{border-color:#a9b4c3}
  .opt input{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--brand)}
  .opt.on{border-color:var(--brand);background:var(--brand-soft)}
  .opt.dis{opacity:.45;cursor:not-allowed}
  .opt .badge{margin-left:auto;flex:0 0 auto;min-width:54px;text-align:center;font-size:13px;font-weight:700;color:var(--brand-ink);background:var(--brand);border-radius:999px;padding:2px 8px;visibility:hidden}
  .opt.on .badge{visibility:visible}
  .other{margin:6px 0 0 30px}
  input[type=text],textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #b9c2cf;border-radius:8px;background:#fff;color:var(--ink)}
  textarea{min-height:calc(1.6em * 4 + 22px);resize:vertical;line-height:1.6}
  input[type=text]:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
  .scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
  .scale label{position:relative;cursor:pointer}
  .scale input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .scale span{display:flex;align-items:center;justify-content:center;height:44px;border:1px solid var(--line);border-radius:8px;font-weight:700;font-size:15px;background:#fff}
  .scale input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
  .scale input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
  .ends{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-top:6px}
  .ends span:last-child{text-align:right}
  .sub{border-top:1px dashed var(--line);padding-top:14px;margin-top:14px}
  .sub:first-of-type{border-top:0;padding-top:0}
  .sub .sq{font-weight:600;font-size:16px}
  .msg{color:var(--warn);font-size:14px;font-weight:600;margin-top:8px}
  .nav{display:flex;gap:10px;margin-top:24px}
  button{font:inherit;font-weight:700;font-size:17px;border-radius:10px;padding:14px 18px;cursor:pointer;border:1px solid var(--brand);min-height:52px}
  .primary{background:var(--brand);color:var(--brand-ink);flex:1}
  .ghost{background:#fff;color:var(--brand)}
  button:disabled{opacity:.6;cursor:wait}
  .pagemsg{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 14px;font-weight:600;font-size:15px;margin-top:16px}
  .done{text-align:center;padding:40px 18px}
  .done h1{margin-top:0}
  .demo{background:#fff4d6;border:1px solid #e9c46a;border-radius:10px;padding:10px 14px;font-size:14px;margin-top:16px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (max-width:380px){ .scale{gap:3px} .scale span{font-size:14px;height:40px} body{font-size:16px} }
</style>
</head>

  <div class="in">

    <div class="sec" id="secLabel"></div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>

</header>

<script>

const TEN = (left, right) => ({ left, right });

const SECTIONS = [
 { key:'A', title:'A. 응답자 특성', items:[

    notes:['* 논바이너리: 남성 또는 여성으로만 구분되지 않는 성별 정체성'] },
  { id:'Q3', n:'3', type:'single', text:'귀하의 전체 노동조합 간부 활동 경력은 어느 정도입니까?',

  { id:'Q4', n:'4', type:'single', text:'귀하가 속한 조직의 조합원 규모는 어느 정도입니까?',

  { id:'Q5', n:'5', type:'single', text:'귀하의 주된 근무 지역은 어디입니까?',

 ]},

    hint:'※ 1에 가까울수록 진보, 10에 가까울수록 보수', ...TEN('매우 진보','매우 보수') },
  { id:'Q10', n:'10', type:'single', text:'귀하는 자신의 정치적 견해가 과거와 비교하여, 어떻게 변화했다고 생각하십니까?',

  { id:'Q11', n:'11', type:'group', text:'귀하는 다음 기관이나 조직을 얼마나 신뢰하십니까?',

    rows:[['Q11-1','11-1. 국회'],['Q11-2','11-2. 정부'],['Q11-3','11-3. 법원'],['Q11-4','11-4. 정당·정치인'],['Q11-5','11-5. 언론'],['Q11-6','11-6. 시민사회단체'],['Q11-7','11-7. 내가 속한 사업장의 노동조합'],['Q11-8','11-8. 민주노총'],['Q11-9','11-9. 공공운수노조']] },
  { id:'Q12', n:'12', type:'scale', text:'귀하는 현재 한국의 전반적인 정치 상황에 얼마나 만족하십니까?', ...TEN('매우 불만족한다','매우 만족한다') },

  { id:'Q14', n:'14', type:'single', text:'귀하는 정당이나 후보를 선택할 때, 무엇을 가장 중요하게 고려하십니까?',

 ]},
 { key:'C', title:'C. 지지 정당과 진보정치 인식', items:[
  { id:'Q15', n:'15', type:'single', text:'귀하는 현재 어느 정당을 가장 지지하거나, 가깝게 느끼고 있습니까?',

  { id:'Q16', n:'16', type:'single', text:'귀하의 정당 가입 여부는 어떻습니까?',

  { id:'Q17', n:'17', type:'scale', text:'귀하는 현재 한국의 진보정당*들이 노동자의 이해관계를 얼마나 잘 대변하고 있다고 생각하십니까?',

  { id:'Q18', n:'18', type:'multi', max:2, tag:'최대 2개 선택', text:'귀하께서는 현재 진보정당의 대중적 지지 기반이 확대되지 못하는 주요 이유가 무엇이라고 생각하십니까?',

    options:['진보정당의 이념과 가치에 공감해서','진보정당이 제시한 정책과 공약을 지지해서','기존 정당에 대한 불만이나 실망 때문에','다른 정당 후보보다 신뢰가 가서','노동자가 진보정당에 투표하는 건 당연하다고 생각해서','노동조합의 정치·선거 방침에 따라',{label:'투표한 적 없음.',exclusive:true},{label:'기억나지 않거나 응답하고 싶지 않음.',exclusive:true},{label:'기타',other:true}],

const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const OTHER_MAX = 300, TEXT_MAX = 3000;

/* ---------------- 상태(메모리에만 존재) ---------------- */
let answers = {};   // 문항 id → 값(문자열 | 숫자 | 배열)
let others = {};    // 문항 id → '기타' 직접 입력
let page = -1;      // -1: 첫 화면, 0..4: 섹션, 5: 완료
let submitted = false;

const $app = document.getElementById('app');
const norm = o => typeof o === 'string' ? { label:o } : o;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasAny = () => Object.keys(answers).length > 0 || Object.values(others).some(v => v);
const visible = it => !it.showIf || answers[it.showIf.q] === it.showIf.eq;
const otherLabel = it => (it.options || []).map(norm).find(o => o.other)?.label;

/* ---------------- 화면 그리기 ---------------- */

      □ 담당: 공공운수노조 연대사업부장 서한솔 (010-2562-9051, work.hanthor@gmail.com)

  </div>

  document.getElementById('start').onclick = () => go(0);

function renderSection(i){
  const sec = SECTIONS[i];
  document.getElementById('top').hidden = false;
  document.getElementById('secLabel').textContent = `${i+1} / ${SECTIONS.length} · ${sec.title}`;
  document.getElementById('barFill').style.width = `${(i/SECTIONS.length)*100}%`;
  const last = i === SECTIONS.length - 1;
  $app.innerHTML = `<h2>${esc(sec.title)}</h2>` +
    sec.items.map(renderItem).join('') +
    `<div id="pagemsg"></div>
     <div class="nav">
       ${i>0 ? '<button class="ghost" id="prev">이전</button>' : ''}
       <button class="primary" id="next">${last ? '제출하기' : '다음'}</button>
     </div>
     ${last ? '<p class="hint" style="margin-top:12px">제출하면 응답을 고칠 수 없습니다.</p>' : ''}
     ${SUBMIT_URL ? '' : '<div class="demo"><b>테스트 모드</b> — 응답이 전송되지 않습니다.</div>'}`;
  sec.items.forEach(bindItem);
  sec.items.forEach(it => { if (it.showIf) refreshVisibility(it); });
  if (i>0) document.getElementById('prev').onclick = () => history.back();
  document.getElementById('next').onclick = last ? submit : () => { if (validate(i)) go(i+1); };
}

function notesHtml(it){ return (it.notes||[]).map(t => `<p class="fn">${esc(t)}</p>`).join(''); }
function scaleHtml(name, left, right, label){
  let s = `<div class="scale" role="radiogroup" aria-label="${esc(label)}">`;
  for (let v=1; v<=10; v++){
    const on = answers[name] === v ? 'checked' : '';
    s += `<label><input type="radio" name="${name}" value="${v}" ${on} aria-label="${v}점"><span>${v}</span></label>`;
  }
  return s + `</div><div class="ends" aria-hidden="true"><span>← ${esc(left)}</span><span>${esc(right)} →</span></div>`;
}

function renderItem(it){
  const head = `<legend class="q"><span class="n">${esc(it.n)}.</span>${esc(it.text)}${it.tag ? ` <span class="tag">${esc(it.tag)}</span>` : ''}</legend>` +
               notesHtml(it) +
               (it.hint ? `<p class="hint">${esc(it.hint)}</p>` : '');
  let body = '';
  if (it.type === 'single' || it.type === 'multi' || it.type === 'rank'){
    const kind = it.type === 'single' ? 'radio' : 'checkbox';
    const cur = answers[it.id];
    body = '<div class="opts">' + it.options.map(norm).map((o, k) => {
      const checked = it.type === 'single' ? cur === o.label : (cur||[]).includes(o.label);
      const rankNo = it.type === 'rank' && checked ? (cur.indexOf(o.label)+1) + '순위' : '';
      return `<label class="opt${checked?' on':''}" data-label="${esc(o.label)}">
        <input type="${kind}" name="${it.id}" value="${esc(o.label)}" ${checked?'checked':''}>
        <span>${CIRCLED[k]} ${esc(o.label)}</span>
        ${it.type==='rank' ? `<span class="badge">${rankNo}</span>` : ''}
      </label>` +
      (o.other ? `<div class="other" data-other="${it.id}" ${checked?'':'hidden'}>
        <input type="text" maxlength="${OTHER_MAX}" placeholder="기타 내용을 적어 주세요" aria-label="${esc(it.n)}번 기타 내용" value="${esc(others[it.id]||'')}">
      </div>` : '');
    }).join('') + '</div>';
  } else if (it.type === 'scale'){
    body = scaleHtml(it.id, it.left, it.right, it.n + '번');
  } else if (it.type === 'group'){
    body = it.rows.map(([rid, rtext]) =>
      `<div class="sub" data-row="${rid}"><div class="sq">${esc(rtext)}</div>${scaleHtml(rid, it.left, it.right, rtext)}<div class="msg" hidden></div></div>`).join('');
  } else if (it.type === 'text'){
    body = `<textarea name="${it.id}" rows="4" placeholder="의견을 자유롭게 적어 주세요." maxlength="${TEXT_MAX}" aria-label="${esc(it.n)}번 응답">${esc(answers[it.id]||'')}</textarea>`;
  }
  return `<section class="card" id="card-${it.id}" ${visible(it)?'':'hidden'}><fieldset>${head}${body}</fieldset><div class="msg" id="msg-${it.id}" hidden></div></section>`;
}

function bindItem(it){
  const card = document.getElementById('card-' + it.id);
  if (it.type === 'single'){
    card.querySelectorAll('input[type=radio]').forEach(inp => inp.addEventListener('change', () => {
      answers[it.id] = inp.value;
      card.querySelectorAll('.opt').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
      syncOther(it, card);
      clearErr(it);
      SECTIONS[page].items.filter(x => x.showIf && x.showIf.q === it.id).forEach(refreshVisibility);
    }));
  } else if (it.type === 'multi' || it.type === 'rank'){
    const opts = it.options.map(norm);
    const limit = it.type === 'rank' ? it.count : it.max;
    card.querySelectorAll('input[type=checkbox]').forEach(inp => inp.addEventListener('change', () => {
      let cur = (answers[it.id] || []).slice();
      const o = opts.find(x => x.label === inp.value);
      if (inp.checked){
        if (o.exclusive) cur = [o.label];
        else {
          cur = cur.filter(l => !opts.find(x => x.label === l).exclusive);
          if (cur.length >= limit){ inp.checked = false; flash(it, `최대 ${limit}개까지 선택할 수 있습니다. 바꾸려면 먼저 선택한 항목을 눌러 취소해 주세요.`); return; }
          cur.push(o.label);
        }
      } else cur = cur.filter(l => l !== o.label);
      if (cur.length) answers[it.id] = cur; else delete answers[it.id];
      paintMulti(it, card);
      clearErr(it);
    }));
    paintMulti(it, card);
  } else if (it.type === 'scale'){
    card.querySelectorAll('input[type=radio]').forEach(inp => inp.addEventListener('change', () => { answers[it.id] = Number(inp.value); clearErr(it); }));
  } else if (it.type === 'group'){
    it.rows.forEach(([rid]) => card.querySelectorAll(`input[name="${rid}"]`).forEach(inp => inp.addEventListener('change', () => {
      answers[rid] = Number(inp.value);
      const m = card.querySelector(`[data-row="${rid}"] .msg`); m.hidden = true;
      if (it.rows.every(([r]) => answers[r] != null)) clearErr(it);
    })));
  } else if (it.type === 'text'){
    const ta = card.querySelector('textarea');
    ta.addEventListener('input', () => { const v = ta.value; if (v.trim()) answers[it.id] = v; else delete answers[it.id]; });
  }
  const ot = card.querySelector('.other input');
  if (ot) ot.addEventListener('input', () => { if (ot.value.trim()) others[it.id] = ot.value; else delete others[it.id]; });
}

function paintMulti(it, card){
  const cur = answers[it.id] || [];
  const limit = it.type === 'rank' ? it.count : it.max;
  const opts = it.options.map(norm);
  const full = cur.length >= limit || cur.some(l => opts.find(x => x.label === l).exclusive);
  card.querySelectorAll('.opt').forEach(l => {
    const inp = l.querySelector('input');
    const on = cur.includes(inp.value);
    inp.checked = on;
    l.classList.toggle('on', on);
    const o = opts.find(x => x.label === inp.value);
    l.classList.toggle('dis', !on && full && !o.exclusive);
    const b = l.querySelector('.badge'); if (b) b.textContent = on ? (cur.indexOf(inp.value)+1) + '순위' : '';
  });
  syncOther(it, card);
}

function syncOther(it, card){
  const box = card.querySelector('.other'); if (!box) return;
  const ol = otherLabel(it);
  const cur = answers[it.id];
  const on = Array.isArray(cur) ? cur.includes(ol) : cur === ol;
  box.hidden = !on;
  if (!on){ box.querySelector('input').value = ''; delete others[it.id]; }
}

function refreshVisibility(it){
  const card = document.getElementById('card-' + it.id);
  const show = visible(it);
  card.hidden = !show;
  if (!show){ // 조건이 맞지 않으면 해당 문항 응답을 지웁니다
    delete answers[it.id]; delete others[it.id];
    card.querySelectorAll('input').forEach(i => { if (i.type === 'text') i.value = ''; else i.checked = false; });
    card.querySelectorAll('.opt').forEach(l => l.classList.remove('on'));
    const box = card.querySelector('.other'); if (box) box.hidden = true;
    clearErr(it);
  }
}

/* ---------------- 검사 ---------------- */
function flash(it, text){ const m = document.getElementById('msg-' + it.id); m.textContent = text; m.hidden = false; }
function clearErr(it){
  const card = document.getElementById('card-' + it.id);
  card.classList.remove('err');
  const m = document.getElementById('msg-' + it.id); m.hidden = true;
  const pm = document.getElementById('pagemsg'); if (pm && !document.querySelector('.card.err')) pm.innerHTML = '';
}
function problem(it){
  if (!visible(it) || it.optional) return null;
  const v = answers[it.id];
  if (it.type === 'single' || it.type === 'scale') return v == null ? '응답해 주세요.' : null;
  if (it.type === 'multi') return (v && v.length) ? null : '1개 이상 선택해 주세요.';
  if (it.type === 'rank'){
    if (!v || !v.length) return `${it.count}개를 순서대로 선택해 주세요.`;
    const opts = it.options.map(norm);
    if (v.some(l => opts.find(x => x.label === l).exclusive)) return null;
    return v.length === it.count ? null : `${it.count}개를 선택해 주세요. (현재 ${v.length}개)`;
  }
  if (it.type === 'group'){
    const miss = it.rows.filter(([r]) => answers[r] == null);
    miss.forEach(([r]) => { const m = document.querySelector(`[data-row="${r}"] .msg`); if (m){ m.textContent = '점수를 선택해 주세요.'; m.hidden = false; } });
    return miss.length ? `응답하지 않은 항목이 ${miss.length}개 있습니다.` : null;
  }
  return null;
}
function validate(i){
  let first = null, count = 0;
  SECTIONS[i].items.forEach(it => {
    const p = problem(it);
    const card = document.getElementById('card-' + it.id);
    if (p){ card.classList.add('err'); flash(it, p); count++; if (!first) first = card; }
    else { card.classList.remove('err'); document.getElementById('msg-' + it.id).hidden = true; }
  });
  const pm = document.getElementById('pagemsg');
  if (first){
    pm.innerHTML = `<div class="pagemsg" role="alert">응답하지 않은 문항이 ${count}개 있습니다. 빨간색으로 표시된 문항을 확인해 주세요.</div>`;
    first.scrollIntoView({ behavior:'smooth', block:'start' });
    const f = first.querySelector('input,textarea'); if (f) setTimeout(() => f.focus({ preventScroll:true }), 300);
    return false;
  }
  pm.innerHTML = '';
  return true;
}

/* ---------------- 전송할 1행 만들기 ----------------
   열 순서는 항상 같습니다. 해당 없는 칸은 빈칸입니다.
   값은 화면에 보인 보기 문구 그대로(가공 없음), 척도는 숫자입니다. */
function buildRow(){
  const row = [];
  const put = (col, v) => row.push([col, v == null ? '' : v]);
  SECTIONS.forEach(sec => sec.items.forEach(it => {
    const vis = visible(it), v = vis ? answers[it.id] : undefined;
    if (it.type === 'single'){ put(it.id, v); if (otherLabel(it)) put(it.id + '_기타응답', vis ? others[it.id] : ''); }
    else if (it.type === 'scale' || it.type === 'text') put(it.id, v);
    else if (it.type === 'group') it.rows.forEach(([r]) => put(r, answers[r]));
    else if (it.type === 'rank'){ for (let k=0;k<it.count;k++) put(`${it.id}_${k+1}순위`, (v||[])[k]); if (otherLabel(it)) put(it.id + '_기타응답', others[it.id]); }
    else if (it.type === 'multi'){ for (let k=0;k<it.max;k++) put(`${it.id}_선택${k+1}`, (v||[])[k]); if (otherLabel(it)) put(it.id + '_기타응답', others[it.id]); }
  }));
  return row;
}

/* ---------------- 제출 ---------------- */
async function submit(){
  if (!validate(page)) return;
  const btn = document.getElementById('next');
  btn.disabled = true; btn.textContent = '제출하는 중…';
  const row = buildRow();
  try {
    if (!SUBMIT_URL){
      window.__lastRow = row; // 테스트 모드: 전송하지 않음
      await new Promise(r => setTimeout(r, 300));
    } else {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 30000);
      const res = await fetch(SUBMIT_URL, {
        method:'POST', body: JSON.stringify({ v:1, row }),
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        credentials:'omit', referrerPolicy:'no-referrer', cache:'no-store', redirect:'follow', signal: ctrl.signal
      });
      clearTimeout(timer);
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || 'fail');
    }
    finish();
  } catch (e){
    btn.disabled = false; btn.textContent = '다시 제출하기';
    const closed = e && e.message === 'closed';
    document.getElementById('pagemsg').innerHTML = `<div class="pagemsg" role="alert">${closed
      ? '설문이 마감되어 응답을 받을 수 없습니다.'
      : '제출하지 못했습니다. 인터넷 연결을 확인한 뒤 ‘다시 제출하기’를 눌러 주세요. 입력하신 응답은 이 창을 닫기 전까지 그대로 남아 있습니다.'}</div>`;
  }
}

function finish(){
  submitted = true;
  answers = {}; others = {};
  page = SECTIONS.length;
  history.replaceState({ p: 'done' }, '');
  document.getElementById('top').hidden = true;
  $app.innerHTML = `<div class="card done"><h1>응답이 제출되었습니다</h1>
    <p>소중한 시간을 내어 응답해 주셔서 감사합니다.</p>
    <p class="hint">이제 이 창을 닫으셔도 됩니다.</p>
    ${SUBMIT_URL ? '' : '<div class="demo"><b>테스트 모드</b> — 실제로는 전송되지 않았습니다.</div>'}</div>`;
  window.scrollTo(0, 0);
}

/* ---------------- 화면 이동(브라우저 '뒤로' 버튼 지원) ---------------- */
function show(p){
  page = p;
  if (p < 0) renderIntro(); else renderSection(p);
  window.scrollTo(0, 0);
  const h = $app.querySelector('h1,h2'); if (h){ h.tabIndex = -1; h.focus({ preventScroll:true }); }
}
function go(p){ history.pushState({ p }, ''); show(p); }
window.addEventListener('popstate', e => {
  if (submitted){ history.replaceState({ p:'done' }, ''); return; }
  const p = e.state && typeof e.state.p === 'number' ? e.state.p : -1;
  show(p);
});
window.addEventListener('beforeunload', e => {
  if (!submitted && hasAny()){ e.preventDefault(); e.returnValue = ''; }
});

history.replaceState({ p:-1 }, '');
show(-1);
</script>
